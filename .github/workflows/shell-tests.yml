name: Shell Tests

on:
  push:
    branches:
      - main
      - work
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install shell quality tools
        run: sudo apt-get update && sudo apt-get install -y age shellcheck shfmt

      - name: Validate scripts and run test suites
        run: bash tests/test_suite.sh

      - name: Run ShellCheck
        run: bash tests/shell_quality.sh shellcheck

      - name: Check shell formatting
        run: bash tests/shell_quality.sh shfmt

  macos-validation:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install age
        run: brew install age

      - name: Validate shell behavior
        run: bash tests/test_suite.sh

      - name: Validate rendered LaunchAgent plist
        run: |
          sed \
            -e '/{{-.*-}}/d' \
            -e 's/{{ .chezmoi.homeDir }}/\/Users\/runner/g' \
            -e 's/{{ $hour }}/4/g' \
            -e 's/{{ $minute }}/0/g' \
            dot_Library/LaunchAgents/com.chezmoi.mac-dotfiles.maintenance.plist.tmpl > /tmp/maintenance.plist
          plutil -lint /tmp/maintenance.plist

      - name: Generate certification attestation
        run: |
          CHEZMOI_SOURCE_DIR="$GITHUB_WORKSPACE" \
            MAC_DOTFILES_STATE_DIR="$RUNNER_TEMP/mac-dotfiles-state" \
            bash dot_local/bin/executable_mac-dotfiles-certify.sh.tmpl \
              --json --skip-live --output "$RUNNER_TEMP/mac-dotfiles-certification.json"
          jq -e '.overall == "pass" and .schema_version == 1' "$RUNNER_TEMP/mac-dotfiles-certification.json"

      - name: Upload certification attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-dotfiles-certification
          path: ${{ runner.temp }}/mac-dotfiles-certification.json
          retention-days: 14
